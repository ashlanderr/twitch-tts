# Publishes the voices page (static/voices.html + static/samples/) to GitHub Pages.
# In the repository: Settings -> Pages -> Source: GitHub Actions.
name: Voices page

on:
  push:
    branches: [main]
    paths:  # samples come from LFS: don't spend its quota on unrelated pushes
      - static/voices.html
      - static/samples/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Assemble the site
        run: |
          mkdir _site
          cp static/voices.html _site/index.html
          cp -r static/samples _site/samples
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
