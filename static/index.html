<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTS Chat Test</title>
<style>
  :root {
    --bg: #0e0e10; --panel: #18181b; --panel2: #1f1f23; --line: #2f2f35;
    --text: #efeff1; --muted: #adadb8; --accent: #a970ff; --ok: #3fbf7f; --warn: #e5a50a; --bad: #eb5757;
    --app: #a970ff; --sys: #5aa9ff; --game: #e5a50a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; height: calc(100vh - 45px); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #chat { height: 60vh; } }

  /* chat */
  #chatwrap { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 10px; min-height: 0; }
  .msg { padding: 4px 6px; border-radius: 4px; margin: 1px 0; word-wrap: break-word; }
  .msg.playing { background: rgba(169,112,255,.16); }
  .msg.synth { background: rgba(90,169,255,.10); }
  .msg .user { font-weight: 700; }
  .msg .meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .badge { padding: 0 5px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line); }
  .badge.playing { color: var(--accent); border-color: var(--accent); }
  .badge.synth, .badge.ready { color: var(--sys); border-color: var(--sys); }
  .badge.done { color: var(--ok); }
  .badge.dropped, .badge.error, .badge.deleted, .badge.unknown_voice { color: var(--bad); border-color: var(--bad); }
  .badge.muted { color: var(--muted); }
  .msg.event { color: var(--game); font-size: 12px; text-align: center; padding: 6px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); margin: 4px 0; }
  .users { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  form#send { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  form#send input { flex: 1; }

  /* controls & metrics */
  #side { overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  button, select, input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.off { background: var(--bad); border-color: var(--bad); color: #fff; }
  label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type=range] { padding: 0; width: 140px; accent-color: var(--accent); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tile { background: var(--panel2); border-radius: 6px; padding: 8px 10px; }
  .tile .k { font-size: 11px; color: var(--muted); }
  .tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 12px; color: var(--muted); font-weight: 400; }

  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .chart { background: var(--panel2); border-radius: 6px; padding: 8px 10px; }
  .chart .title { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .legend { display: flex; gap: 10px; font-size: 11px; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: currentColor; }
  canvas { width: 100%; height: 90px; display: block; }
  .muted { color: var(--muted); font-size: 12px; }
  code { background: var(--panel2); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>TTS Chat Test</h1>
  <span id="status">connecting...</span>
  <a href="/voices" style="margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px">голоса →</a>
</header>
<main>
  <section id="chatwrap">
    <div id="chat"></div>
    <form id="send">
      <input id="text" placeholder="Своё сообщение (например: !!!#bandit Эй, слышь или !tts arthas)" autocomplete="off">
      <button class="primary">Send</button>
    </form>
  </section>

  <section id="side">
    <div class="card">
      <h2>Управление</h2>
      <div class="controls">
        <button id="sim" class="primary">Start chat</button>
        <button id="tts">TTS: on</button>
        <label>Скорость чата <input type="range" id="speed" min="0.25" max="4" step="0.25"> <span id="speedval"></span>× <span class="muted">(1× ≈ 10 сообщ./мин)</span></label>
        <label>Голос <select id="voice"></select></label>
        <label>Очередь до <input type="number" id="maxq" min="1" max="50" style="width:60px"></label>
      </div>
      <div class="users" id="users" style="margin-top:10px"></div>
      <p class="muted" id="output" style="margin:10px 0 0"></p>
      <p class="muted" style="margin:10px 0 0">Для сравнения FPS: запомните FPS с выключенным TTS, затем включите и посмотрите разницу. Метрики пишутся в <code id="logs"></code>.</p>
    </div>

    <div class="card">
      <h2>Задержка озвучки</h2>
      <div class="tiles" id="stats"></div>
    </div>

    <div class="card">
      <h2>Ресурсы</h2>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="card">
      <h2>Последние 2 минуты</h2>
      <div class="charts">
        <div class="chart"><div class="title">CPU, % <div class="legend"><span style="color:var(--app)">app</span><span style="color:var(--sys)">system</span></div></div><canvas id="c_cpu"></canvas></div>
        <div class="chart"><div class="title">GPU load, % <div class="legend"><span style="color:var(--app)">app</span><span style="color:var(--game)">game</span><span style="color:var(--sys)">total</span></div></div><canvas id="c_gpu"></canvas></div>
        <div class="chart"><div class="title">VRAM, GiB <div class="legend"><span style="color:var(--app)">app</span><span style="color:var(--game)">game</span><span style="color:var(--sys)">total</span></div></div><canvas id="c_vram"></canvas></div>
        <div class="chart"><div class="title">RAM app, GiB <div class="legend"><span style="color:var(--app)">app</span></div></div><canvas id="c_ram"></canvas></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ["#ff7f50", "#9acd32", "#1e90ff", "#ff69b4", "#daa520", "#00ced1", "#ba55d3", "#3cb371", "#f08080", "#87cefa"];
const userColor = (u) => COLORS[[...u].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const STATUS = { "audio error: no overlay connected": "нет оверлея (OBS)", queued: "в очереди", synth: "генерация", ready: "готово к озвучке", playing: "звучит", done: "озвучено", dropped: "выброшено", muted: "TTS выкл", empty: "нечего читать", deleted: "удалено модератором", voice_set: "голос выбран", unknown_voice: "нет такого голоса" };
let settings = null, renderedIds = "", renderedOutput = "", stickBottom = true;

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderChat(messages) {
  const chat = $("chat");
  stickBottom = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 30;
  chat.innerHTML = messages.map((m) => {
    if (m.status === "event") return `<div class="msg event">⚡ в игре: ${esc(m.text)}</div>`;
    const st = m.status.startsWith("error") || m.status.startsWith("audio error") ? "error" : m.status;
    const meta = [`<span class="badge ${st}">${esc(STATUS[m.status] || m.status)}</span>`, `<span>${esc(m.voice)}</span>`];
    if (m.rvc_s !== undefined) meta.push(`<span>синтез ${(m.tts_s + m.rvc_s).toFixed(2)}s</span>`);
    if (m.device) meta.push(m.device.startsWith("cpu") ? `<span class="badge dropped">${m.device === "cpu-oom" ? "CPU (OOM)" : "CPU"}</span>` : `<span>GPU</span>`);
    if (m.latency_s !== undefined) meta.push(`<span>до звука ${m.latency_s.toFixed(1)}s</span>`);
    return `<div class="msg ${st}"><span class="user" style="color:${userColor(m.user)}">${esc(m.user)}</span>: ${esc(m.text)}<div class="meta">${meta.join("")}</div></div>`;
  }).join("");
  if (stickBottom) chat.scrollTop = chat.scrollHeight;
}

function tile(k, v, unit = "") {
  return `<div class="tile"><div class="k">${k}</div><div class="v">${v ?? "—"}${v != null && unit ? ` <small>${unit}</small>` : ""}</div></div>`;
}

function chart(id, series, fixedMax) {
  const cv = $(id), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const all = series.flatMap((s) => s.data.filter((v) => v != null));
  const max = fixedMax ?? Math.max(1, ...all) * 1.15;
  ctx.strokeStyle = "#2f2f35"; ctx.lineWidth = 1;
  for (let i = 0; i <= 2; i++) { const y = Math.round(h * i / 2) + .5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.fillStyle = "#adadb8"; ctx.font = "10px Segoe UI, sans-serif"; ctx.fillText(max.toFixed(max < 10 ? 1 : 0), 2, 10);
  const n = 120;
  for (const s of series) {
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.6; ctx.beginPath();
    let started = false;
    s.data.forEach((v, i) => {
      if (v == null) return;
      const x = w - (s.data.length - 1 - i) * (w / (n - 1)), y = h - (v / max) * (h - 4) - 2;
      started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
    });
    ctx.stroke();
  }
}

function render(st) {
  $("status").textContent = st.status;
  settings = st.settings;
  if (!$("voice").options.length) {
    const label = { per_user: "свой у каждого", random: "случайный" };
    $("voice").innerHTML = ["per_user", "random", ...st.voices].map((v) => `<option value="${v}">${label[v] || v}</option>`).join("");
    $("users").innerHTML = Object.entries(st.users).map(([u, v]) => `<span><b style="color:${userColor(u)}">${esc(u)}</b> → ${esc(v)}</span>`).join("");
  }
  if (document.activeElement !== $("voice")) $("voice").value = settings.voice;
  if (document.activeElement !== $("speed")) $("speed").value = settings.speed;
  if (document.activeElement !== $("maxq")) $("maxq").value = settings.max_queue;
  $("speedval").textContent = settings.speed;
  $("sim").textContent = settings.sim_running ? "Pause chat" : "Start chat";
  $("sim").className = settings.sim_running ? "" : "primary";
  $("tts").textContent = settings.tts_enabled ? "TTS: on" : "TTS: off";
  $("tts").className = settings.tts_enabled ? "" : "off";
  $("logs").textContent = "logs/" + st.logs.join(", logs/");
  if (st.twitch) $("status").textContent = `${st.status} · Twitch: ${st.twitch}`;
  const out = st.output || {};
  const outHtml = out.mode === "web"
    ? `Звук: по сети, OBS Browser Source <code>${esc(["localhost", "127.0.0.1"].includes(location.hostname) && out.lan_ip
        ? `http://${out.lan_ip}:${location.port}` : location.origin)}/overlay</code> — ` +
      (out.listeners ? `подключено: ${out.listeners}` : `<span style="color:var(--bad)">никто не подключён, сообщения не озвучиваются</span>`)
    : "Звук: на звуковую карту этого компьютера";
  // rewrite only on change: a rewrite every poll drops the selection, and the overlay URL is there to be copied
  if (outHtml !== renderedOutput) { renderedOutput = outHtml; $("output").innerHTML = outHtml; }

  const ids = st.messages.map((m) => m.id + m.status).join();
  if (ids !== renderedIds) { renderedIds = ids; renderChat(st.messages); }

  const s = st.stats;
  $("stats").innerHTML = [
    tile("озвучено", s.voiced), tile("в очереди", s.queue), tile("выброшено", s.dropped), tile("на CPU (мало VRAM)", s.cpu_fallbacks),
    tile("до звука, сред.", s.lat_avg, "s"), tile("до звука, p95", s.lat_p95, "s"), tile("до звука, макс.", s.lat_max, "s"),
    tile("синтез, сред.", s.synth_avg, "s"), tile("синтез, макс.", s.synth_max, "s"),
  ].join("");

  const m = st.metrics || {};
  $("tiles").innerHTML = [
    tile("CPU app", m.app_cpu_pct, "%"), tile("CPU system", m.sys_cpu_pct, "%"),
    tile("RAM app", m.app_ram_gib, "GiB"), tile("RAM system", m.sys_ram_gib, "GiB"),
    tile("VRAM app", m.app_vram_gib, "GiB"), tile("VRAM total", m.gpu_vram_used_gib != null ? `${m.gpu_vram_used_gib} / ${m.gpu_vram_total_gib}` : null, "GiB"),
    tile("GPU app", m.app_gpu_pct, "%"), tile("GPU total", m.gpu_util_pct, "%"),
    tile(`игра: ${esc(m.game_name || "—")}`, m.game_vram_gib, "GiB VRAM"), tile("GPU игры", m.game_gpu_pct, "%"),
  ].join("");

  const H = st.history, col = (k) => H.map((r) => r[k] ?? null);
  const css = getComputedStyle(document.documentElement), c = (v) => css.getPropertyValue(v).trim();
  chart("c_cpu", [{ data: col("sys_cpu_pct"), color: c("--sys") }, { data: col("app_cpu_pct"), color: c("--app") }], 100);
  chart("c_gpu", [{ data: col("gpu_util_pct"), color: c("--sys") }, { data: col("game_gpu_pct"), color: c("--game") }, { data: col("app_gpu_pct"), color: c("--app") }], 100);
  chart("c_vram", [{ data: col("gpu_vram_used_gib"), color: c("--sys") }, { data: col("game_vram_gib"), color: c("--game") }, { data: col("app_vram_gib"), color: c("--app") }], m.gpu_vram_total_gib || null);
  chart("c_ram", [{ data: col("app_ram_gib"), color: c("--app") }]);
}

async function tick() {
  try { render(await (await fetch("/api/state")).json()); }
  catch (e) { $("status").textContent = "нет связи с приложением"; }
  setTimeout(tick, 700);
}

$("sim").onclick = () => post("/api/settings", { sim_running: !settings.sim_running });
$("tts").onclick = () => post("/api/settings", { tts_enabled: !settings.tts_enabled });
$("speed").oninput = () => { $("speedval").textContent = $("speed").value; };
$("speed").onchange = () => post("/api/settings", { speed: +$("speed").value });
$("voice").onchange = () => post("/api/settings", { voice: $("voice").value });
$("maxq").onchange = () => post("/api/settings", { max_queue: +$("maxq").value });
$("send").onsubmit = (e) => { e.preventDefault(); const t = $("text").value.trim(); if (t) { post("/api/send", { text: t }); $("text").value = ""; } };
tick();
</script>
</body>
</html>
